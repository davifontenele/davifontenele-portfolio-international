<!doctype html>
<html lang="%lang%" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" href="%sveltekit.assets%/favicon.svg" />

    <!-- A fonte do título é crítica para o LCP; as demais carregam pelo CSS local. -->
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/roboto-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/posters/hero.jpg"
      as="image"
      fetchpriority="high"
    />

    <!-- Google Tag Manager (GTM-WK6KVJ2C). Carrega após load/idle para não disputar
         a renderização inicial — mesmo padrão do site original. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag('js', new Date());

      function loadTagManager() {
        if (document.querySelector('script[data-gtm]')) return;
        window.dataLayer.push({ 'gtm.start': new Date().getTime(), event: 'gtm.js' });
        const script = document.createElement('script');
        script.async = true;
        script.dataset.gtm = 'true';
        script.src = 'https://www.googletagmanager.com/gtm.js?id=GTM-WK6KVJ2C';
        document.head.appendChild(script);
      }

      window.addEventListener(
        'load',
        () => {
          if ('requestIdleCallback' in window) {
            window.requestIdleCallback(loadTagManager, { timeout: 5000 });
          } else {
            window.setTimeout(loadTagManager, 3000);
          }
        },
        { once: true }
      );
    </script>

    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
